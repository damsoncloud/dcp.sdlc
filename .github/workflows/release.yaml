name: Release

# Tags the default branch's HEAD as a release vX.Y.Z and moves the floating major tag vX to it. Reusable workflows reference this
# repository's actions by the floating major tag, as GITHUB_TOKEN cannot push commits changing workflow files.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the semantic version to increase
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7 # This is only needed if using `initialise_devenv` composite action from the same repository
      - uses: ./.github/actions/initialise_devenv
        with:
          checkout_fetch_depth: 0
          github_access_token: ${{ github.token }}

      - name: Create and push the release tags
        shell: devenv shell bash -- -e {0}
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag=$(release_tag "$BUMP")
          git push origin "refs/tags/$tag"
          git push --force origin "refs/tags/${tag%%.*}"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Create the GitHub release
        run: gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
