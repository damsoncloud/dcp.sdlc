name: Release

# Tags a release of this repository. The tagged commit is created off the default branch: it pins this repository's own
# workflow and action references from @main to the release tag, so a released version only ever uses itself.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the semantic version to increase
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7 # This is only needed if using `initialise_devenv` composite action from the same repository
      - uses: ./.github/actions/initialise_devenv
        with:
          checkout_fetch_depth: 0
          github_access_token: ${{ github.token }}

      - name: Create and push the release tag
        shell: devenv shell bash -- -e {0}
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          tag="v$(version_bump "$BUMP")"
          release_prepare "$tag"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The release commit lives only under the tag, never on a branch
          git switch --detach
          git commit --all --message "Release $tag"
          git tag --annotate "$tag" --message "Release $tag"
          git push origin "refs/tags/$tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Create the GitHub release
        run: gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
