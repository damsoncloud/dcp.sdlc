name: Container image CI

# Builds, smoke-tests and scans the container image of a repository using the devenvbase `container-image` module.
# Callers must grant `contents: read` and `security-events: write`.

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  container-image:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: '0'

    steps:
      - uses: damsoncloud/dcp.sdlc/.github/actions/initialise_devenv@v1
        with:
          github_access_token: ${{ github.token }}

      - name: Build the container image
        shell: devenv shell bash -- -e {0}
        run: image_build

      - name: Run smoke tests against the container image
        shell: devenv shell bash -- -e {0}
        run: |
          if command -v image_test >/dev/null; then
            image_test
          else
            echo "::notice::No smoke tests configured (dcp.containerImage.smokeTest)"
          fi

      - name: Scan the container image for vulnerabilities
        shell: devenv shell bash -- -e {0}
        run: image_scan trivy.sarif

      # Pull requests from forks get a read-only token, which cannot upload results
      - if: >-
          ${{ !cancelled() && hashFiles('trivy.sarif') != ''
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        name: Upload the vulnerability scan results to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: image-build
