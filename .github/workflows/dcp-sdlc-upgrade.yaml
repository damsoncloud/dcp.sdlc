name: dcp.sdlc upgrade

# Upgrades a repository to the latest dcp.sdlc release and updates all devenv inputs, validates the result and opens a pull request.
# Pull requests opened with GITHUB_TOKEN do not trigger other workflows, so validation runs here: `devenv test` and, for repositories
# using the devenvbase `container-image` module, the image build, smoke tests and scan.
# Callers must grant `contents: write` and `pull-requests: write`.

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: '0'
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: damsoncloud/dcp.sdlc/.github/actions/initialise_devenv@main
        with:
          github_access_token: ${{ github.token }}
          skip_devenv_test: 'true'

      - name: Upgrade dcp.sdlc and update devenv inputs
        id: upgrade
        shell: devenv shell bash -- -e {0}
        run: |
          echo "version=$(dcp_sdlc_upgrade)" >> "$GITHUB_OUTPUT"
          devenv update

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "::notice::Already up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changes.outputs.changed == 'true'
        name: Run tests
        run: devenv test

      - if: steps.changes.outputs.changed == 'true'
        name: Build, smoke-test and scan the container image
        shell: devenv shell bash -- -e {0}
        run: |
          if ! command -v image_build >/dev/null; then
            echo "::notice::No container image configured (dcp.containerImage)"
            exit 0
          fi
          image_build
          if command -v image_test >/dev/null; then image_test; fi
          image_scan

      - if: steps.changes.outputs.changed == 'true'
        name: Open a pull request
        shell: devenv shell bash -- -e {0}
        env:
          VERSION: ${{ steps.upgrade.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch="chore/dcp-sdlc-upgrade-$(date -u +%Y-%m-%d)"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "::notice::Branch $branch already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git commit --all --message "chore(deps): upgrade dcp.sdlc to $VERSION and update devenv inputs"
          git push origin "$branch"
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "chore(deps): upgrade dcp.sdlc to $VERSION and update devenv inputs" \
            --body "Validated by \`devenv test\` and, where configured, the container image build, smoke tests and scan in $RUN_URL."
