name: CI for the devenvbase folder

on:
  pull_request:
    paths:
      - 'devenvbase/**'
      - '.github/workflows/devenvbase-ci.yaml'
  push:
    branches:
      - main
    paths:
      - 'devenvbase/**'

jobs:
  devenvbase-ci:
    runs-on: dcp-ubuntu-latest-2core
    steps:
      - uses: actions/checkout@v6
      - name: Build the devenv shell and run any pre-commit hooks
        run: devenv test
