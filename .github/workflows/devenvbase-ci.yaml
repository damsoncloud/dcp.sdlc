name: CI for the devenvbase folder

on:
  pull_request:
    paths:
      - 'devenvbase/**'
      - '.github/workflows/devenvbase-ci.yaml'
      - '.github/actions/initialise_devenv/*'
  push:
    branches:
      - main
    paths:
      - 'devenvbase/**'
      - '.github/workflows/devenvbase-ci.yaml'
      - '.github/actions/initialise_devenv/*'

permissions:
  contents: read

jobs:
  devenvbase-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7 # This is only needed if using `initialise_devenv` composite action from the same repository
      - uses: ./.github/actions/initialise_devenv
        with:
          github_access_token: ${{ github.token }}
