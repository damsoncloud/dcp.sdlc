name: CI for the devenvbase folder

on:
  pull_request:
    paths:
      - 'devenvbase/**'
      - '.github/workflows/devenvbase-ci.yaml'
      - '.github/actions/initialise_devenv/*'
  push:
    branches:
      - main
    paths:
      - 'devenvbase/**'
      - '.github/workflows/devenvbase-ci.yaml'
      - '.github/actions/initialise_devenv/*'

permissions:
  contents: read
  id-token: write

jobs:
  devenvbase-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7 # This is only needed if using `initialise_devenv` composite action from the same repository
      - uses: ./.github/actions/initialise_devenv
        with:
          gcp_workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ vars.GCP_TERRAFORM_COMMON_SA }}
          github_access_token: ${{ secrets.DEVENV_GITHUB_TOKEN }}
