name: Container image release

# Releases the container image of a repository using the devenvbase `container-image` module: bumps the version from the latest
# `v*` tag, builds, smoke-tests and scans the image, pushes it to GitHub Packages, creates a GitHub release and opens a pull request
# with the version bump when version files changed. Runs only on the default branch.
# Callers must grant `contents: write`, `packages: write` and `pull-requests: write`.

on:
  workflow_call:
    inputs:
      bump:
        description: Part of the semantic version to increase (major, minor or patch)
        type: string
        required: true

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    env:
      FORCE_COLOR: '0'
      GH_TOKEN: ${{ github.token }}
      REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - uses: damsoncloud/dcp.sdlc/.github/actions/initialise_devenv@v1
        with:
          checkout_fetch_depth: 0
          github_access_token: ${{ github.token }}

      - name: Bump the version from the latest release tag
        id: version
        shell: devenv shell bash -- -e {0}
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version=$(version_bump "$BUMP")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the container image
        shell: devenv shell bash -- -e {0}
        run: image_build

      - name: Run smoke tests against the container image
        shell: devenv shell bash -- -e {0}
        run: |
          if command -v image_test >/dev/null; then
            image_test
          else
            echo "::notice::No smoke tests configured (dcp.containerImage.smokeTest)"
          fi

      - name: Scan the container image for vulnerabilities
        shell: devenv shell bash -- -e {0}
        run: image_scan

      - name: Push the container image
        shell: devenv shell bash -- -e {0}
        run: |
          podman login "${REGISTRY_IMAGE%%/*}" --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
          image_push

      - name: Create the GitHub release
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes

      - name: Open a pull request with the version bump
        shell: devenv shell bash -- -e {0}
        run: |
          if git diff --quiet; then
            echo "::notice::No version files changed, skipping the version bump pull request"
            exit 0
          fi
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git commit --all --message "chore: bump version to $VERSION"
          git push origin "$branch"
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" --title "chore: bump version to $VERSION" \
            --body "Version bump after releasing $REGISTRY_IMAGE:$VERSION."
