name: Builder for the custom runner image including pre-installed tools like devenv.sh

on:
  schedule:
    - cron: '15 1 * * 1'
  workflow_dispatch:

jobs:
  build-dcp-builder-image:
    runs-on: ubuntu-latest-2core
    snapshot:
      image-name: dcp-builder
      version: 1.*
    steps:
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv
